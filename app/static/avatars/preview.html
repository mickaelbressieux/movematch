<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pose avatars</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f6fb; color: #1d2433;
         margin: 0; padding: 24px 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  .grid { display: grid; gap: 16px;
           grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  figure { margin: 0; background: #fff; border-radius: 12px; padding: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
  img { width: 100%; max-width: 200px; height: auto; }
  figcaption { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
  figcaption span { color: #5b6478; }
  code { color: #8a93a6; font-size: .8rem; }
</style></head><body>
<h1>MoveMatch pose avatars (YOLO moves)</h1>
<div class="grid">
<figure><img src="arms_crossed.svg" alt="arms_crossed"><figcaption><b>arms crossed</b><span>cross your arms</span><code>arms_crossed</code></figcaption></figure>
<figure><img src="clap.svg" alt="clap"><figcaption><b>clapping</b><span>clap your hands</span><code>clap</code></figcaption></figure>
<figure><img src="hands_on_head.svg" alt="hands_on_head"><figcaption><b>hands on head</b><span>put your hands on your head / touch your head</span><code>hands_on_head</code></figcaption></figure>
<figure><img src="raise_one_arm.svg" alt="raise_one_arm"><figcaption><b>one arm raised</b><span>raise one arm</span><code>raise_one_arm</code></figcaption></figure>
<figure><img src="wave.svg" alt="wave"><figcaption><b>waving</b><span>wave</span><code>wave</code></figcaption></figure>
<figure><img src="crouch.svg" alt="crouch"><figcaption><b>crouching</b><span>crouch down</span><code>crouch</code></figcaption></figure>
<figure><img src="touch_knee.svg" alt="touch_knee"><figcaption><b>touching a knee</b><span>touch your knee</span><code>touch_knee</code></figcaption></figure>
<figure><img src="point_camera.svg" alt="point_camera"><figcaption><b>pointing at camera</b><span>point at the camera</span><code>point_camera</code></figcaption></figure>
</div></body></html>
